server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # uploads are capped at 2 MiB by the API; leave headroom for multipart overhead
    client_max_body_size 3m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|docs|openapi\.json|redoc) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # client-side routing: unknown paths fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
