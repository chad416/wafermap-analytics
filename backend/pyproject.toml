[project]
name = "wafermap"
version = "0.1.0"
description = "Wafer-map defect analytics: ingestion, defect-pattern classification and yield analytics for WM-811K style wafer test maps."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Runtime dependencies: everything the API container needs (no PyTorch — the CNN is served via ONNX Runtime).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "lightgbm>=4.5",
    "onnxruntime>=1.19",
    "pyarrow>=17",  # parquet ingest (seed job)
]

[project.optional-dependencies]
# Offline data pipeline + training (not installed in the API image).
ml = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "playwright>=1.47",
]

[project.scripts]
wafermap = "wafermap.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wafermap"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PL"]
ignore = [
    "PLR0913", "PLR0917", "PLR2004", "PLR0915", "PLR0912",
    # Deliberate: heavy optional deps (torch, matplotlib, lightgbm, onnxruntime) are imported
    # inside the functions that need them so the API never pays for training-only imports.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"alembic/versions/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src/wafermap"]

[[tool.mypy.overrides]]
# scikit-image / lightgbm ship no type hints
module = ["wafermap.ml.*", "wafermap.data.*", "wafermap.features.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
