name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install runtime + training + dev dependencies (PyTorch CPU wheel)
        run: uv sync --frozen --extra ml
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests (SQLite, committed models)
        run: uv run pytest --cov=wafermap --cov-report=term-missing

  backend-postgres:
    # Same migrations + API tests against PostgreSQL, the production database.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wafermap
          POSTGRES_PASSWORD: wafermap
          POSTGRES_DB: wafermap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wafermap" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      WAFERMAP_TEST_DATABASE_URL: postgresql+psycopg://wafermap:wafermap@localhost:5432/wafermap_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/test_api.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Smoke test (stack without dataset -> empty DB, prediction still works)
        run: |
          docker compose up -d --wait api web
          curl -fsS http://localhost:8000/api/v1/health
          python3 -c "import json; print(json.dumps({'grid': [[1]*20 for _ in range(20)]}))" \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- \
              http://localhost:8080/api/v1/predict
      - if: always()
        run: docker compose down -v
